<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21"
      data-width="1920"
      data-height="1080"
    >
      <video
        id="take"
        class="clip"
        src="assets/take.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="21"
        data-track-index="1"
        data-volume="0"
        style="position:absolute; inset:0; width:1920px; height:1080px; object-fit:contain; background:#0a0a0f"
      ></video>
      <!-- beat-locked: natural timing. The lock at 1.5s and the reveal at 8.0s are the real round. -->
      <div
        id="bar"
        data-layout-ignore
        style="position:absolute; left:0; bottom:0; width:1920px; height:4px; background:#22e5ff; transform-origin:left center; z-index:2"
      ></div>
      <audio
        id="bed"
        src="assets/music/bed.wav"
        data-start="0"
        data-duration="20"
        data-track-index="10"
        data-volume="0.28"
        data-fade-out="2"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.28},{"t":1.6,"v":0.28},{"t":1.75,"v":0.10},{"t":4.3,"v":0.10},{"t":4.5,"v":0.28},{"t":8.0,"v":0.28},{"t":8.15,"v":0.10},{"t":11.7,"v":0.10},{"t":12.0,"v":0.26},{"t":18.5,"v":0.26},{"t":20,"v":0}]}]}'
      ></audio>
      <audio
        id="question"
        src="assets/voice/question.mp3"
        data-start="1.7"
        data-duration="2.42"
        data-track-index="11"
        data-volume="1"
      ></audio>
      <audio
        id="verdict"
        src="assets/voice/verdict.mp3"
        data-start="8.15"
        data-duration="3.4"
        data-track-index="12"
        data-volume="1"
      ></audio>
      <audio
        id="sfx-lock"
        src="assets/sfx/interface/click_001.ogg"
        data-start="1.45"
        data-duration="0.1"
        data-track-index="13"
        data-volume="0.45"
      ></audio>
      <audio
        id="sfx-reveal"
        src="assets/sfx/impact/impactSoft_medium_000.ogg"
        data-start="8.0"
        data-duration="0.12"
        data-track-index="14"
        data-volume="0.5"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 21, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
